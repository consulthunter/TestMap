[project]
name = "analysis"
version = "0.1.0"
description = "Python Project for TestMap Analysis"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.5.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.0",
    "jupyter>=1.1.1",
    "scipy>=1.18.0",
    "click>=8.4.2",
    "papermill>=2.7.0",
]

[project.scripts]
analysis = "analysis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]
